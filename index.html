<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XIAO Direct-to-Drive</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #16213e; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 400px; }
        h2 { margin-top: 0; color: #e94560; }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-connect { background: #e94560; color: white; }
        .btn-capture { background: #0f3460; color: white; }
        .btn-upload { background: #533483; color: white; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        #status { margin-top: 20px; font-size: 14px; min-height: 20px; color: #a0a0a0; }
        
        .progress-container { 
            height: 25px; 
            background: #0f3460; 
            border-radius: 12px; 
            margin-top: 20px; 
            overflow: hidden; 
            display: none;
            border: 2px solid #e94560;
        }
        .progress-bar { 
            height: 100%; 
            background: linear-gradient(90deg, #e94560, #ff6b6b); 
            width: 0%; 
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }
        
        input[type="file"] { display: none; }
        .file-label { display: block; padding: 12px; background: #0f3460; border-radius: 10px; cursor: pointer; margin-bottom: 10px; }
        .note { font-size: 12px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📷 XIAO Direct-to-Drive</h2>
        <button class="btn-connect" id="connectBtn" onclick="connectSerial()">🔌 Connect to XIAO</button>
        
        <button class="btn-capture" id="captureBtn" onclick="sendCommand('CAMERA\n')" disabled>📸 Capture & Send</button>
        
        <label class="file-label" for="fileInput">📁 Choose File: <span id="fileName">None</span></label>
        <input type="file" id="fileInput" accept="image/*">
        <button class="btn-upload" id="uploadBtn" onclick="sendFile()" disabled>☁️ Upload File</button>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        
        <div id="status">Waiting for connection...</div>
        <div class="note">Note: Camera capture requires Arduino C++. Use FILE upload with MicroPython.</div>
    </div>

    <script>
        let port, reader;
        let fileBuffer = null;
        let bytesSent = 0;
        let totalBytes = 0;

        async function connectSerial() {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                document.getElementById('connectBtn').textContent = "✅ Connected";
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('captureBtn').disabled = false;
                document.getElementById('status').textContent = "Ready for commands.";
                
                readLoop();
            } catch (err) {
                document.getElementById('status').textContent = "❌ Connection failed: " + err;
            }
        }

        async function readLoop() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();
            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += value;
                
                let lines = buffer.split('\n');
                buffer = lines.pop();

                for (let line of lines) {
                    line = line.trim();
                    if (!line) continue;

                    if (line.startsWith("SEND:")) {
                        const size = parseInt(line.split(':')[1]);
                        await sendChunk(size);
                    } else if (line === "DONE") {
                        document.getElementById('status').textContent = "✅ Success! Check Google Drive.";
                        document.getElementById('progressContainer').style.display = 'none';
                        enableButtons();
                    } else if (line.startsWith("PROGRESS:")) {
                        const pct = parseInt(line.split(':')[1]);
                        updateProgress(pct);
                    } else if (line.startsWith("ERROR")) {
                        document.getElementById('status').textContent = "❌ " + line;
                        document.getElementById('progressContainer').style.display = 'none';
                        enableButtons();
                    } else {
                        console.log("ESP:", line);
                    }
                }
            }
        }

        async function sendChunk(size) {
            if (!fileBuffer) return;
            const chunk = fileBuffer.slice(bytesSent, bytesSent + size);
            const writer = port.writable.getWriter();
            await writer.write(chunk);
            writer.releaseLock();
            
            bytesSent += size;
            const pct = Math.min(100, Math.round((bytesSent / totalBytes) * 100));
            updateProgress(pct);
        }

        function updateProgress(pct) {
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = pct + "%";
            progressBar.textContent = pct + "%";
        }

        async function sendCommand(cmd) {
            disableButtons();
            document.getElementById('status').textContent = "⏳ Processing...";
            const writer = port.writable.getWriter();
            await writer.write(new TextEncoder().encode(cmd));
            writer.releaseLock();
        }

        async function sendFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            
            disableButtons();
            document.getElementById('progressContainer').style.display = 'block';
            updateProgress(0);
            document.getElementById('status').textContent = "☁️ Streaming to Drive...";
            
            fileBuffer = await file.arrayBuffer();
            bytesSent = 0;
            totalBytes = fileBuffer.byteLength;
            const ext = file.name.split('.').pop();
            
            const writer = port.writable.getWriter();
            await writer.write(new TextEncoder().encode(`FILE:${totalBytes}:${ext}\n`));
            writer.releaseLock();
        }

        function disableButtons() {
            document.getElementById('captureBtn').disabled = true;
            document.getElementById('uploadBtn').disabled = true;
        }
        function enableButtons() {
            document.getElementById('captureBtn').disabled = false;
            document.getElementById('uploadBtn').disabled = false;
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                document.getElementById('fileName').textContent = e.target.files[0].name;
                document.getElementById('uploadBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
