<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Cloud Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; text-align: center; padding: 20px; margin: 0; }
        h1 { color: #00e676; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 30px; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; margin: 20px auto; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #333; }
        h3 { color: #fff; margin-top: 0; }
        button, .file-label { background: #00e676; color: #121212; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.2s; box-sizing: border-box; display: inline-block;}
        button:hover, .file-label:hover { background: #00c853; transform: translateY(-2px); }
        .blue-btn { background: #2196f3; color: white; }
        .blue-btn:hover { background: #1976d2; }
        input[type="file"] { display: none; }
        input[type="text"] { padding: 12px; width: 100%; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 8px; margin-top: 10px; box-sizing: border-box; font-size: 16px;}
        .status { margin-top: 15px; color: #888; font-size: 14px; min-height: 20px; }
        .success { color: #00e676; font-weight: bold; }
        .error { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>
    <h1>📷 Cloud Drive Dashboard</h1>
    <p class="subtitle">XIAO ESP32S3 & Google Drive Integration</p>
    
    <div class="card">
        <h3>📡 1. Remote ESP32 Capture</h3>
        <p style="color: #aaa; font-size: 14px;">Triggers the XIAO to take a photo and upload it directly to your Drive.</p>
        <input type="text" id="espIp" placeholder="Enter ESP32 IP (e.g., 192.168.x.x)" value="">
        <button onclick="triggerEsp32()">Trigger Camera & Upload</button>
        <p class="status" id="espStatus">Ready.</p>
    </div>

    <div class="card">
        <h3>📁 2. Local Laptop Upload</h3>
        <p style="color: #aaa; font-size: 14px;">Select an image from your computer to upload directly to your Drive.</p>
        <label for="fileInput" class="file-label blue-btn">Select Local Image</label>
        <input type="file" id="fileInput" accept="image/*" onchange="uploadLocalFile()">
        <p class="status" id="localStatus">Ready.</p>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhAiBMWBEt3AAO4j-Oj1DT6nEOEkLoDao9jq-iFv9GzLdJ-2YFE4Oheqcdp-xPsOM/exec"; 

        async function triggerEsp32() {
            const ip = document.getElementById('espIp').value;
            const statusEl = document.getElementById('espStatus');
            if (!ip) {
                statusEl.className = 'status error';
                statusEl.innerText = "❌ Please enter the ESP32 IP address first.";
                return;
            }
            statusEl.className = 'status';
            statusEl.innerText = "Triggering ESP32... Please wait (~5-8 seconds).";
            
            try {
                await fetch(`http://${ip}/upload`, { mode: 'no-cors' });
                statusEl.className = 'status success';
                statusEl.innerText = "✅ Trigger sent! Check your Google Drive folder.";
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.innerText = "❌ Failed to reach ESP32. Check IP and Wi-Fi.";
            }
        }

        async function uploadLocalFile() {
            const fileInput = document.getElementById('fileInput');
            const statusEl = document.getElementById('localStatus');
            if (fileInput.files.length === 0) return;
            
            const file = fileInput.files[0];
            statusEl.className = 'status';
            statusEl.innerText = "Reading file...";

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result.split(',')[1]; 
                statusEl.innerText = "Uploading to Google Drive...";
                
                try {
                    const payload = { filename: file.name, imageBase64: base64 };
                    const response = await fetch(APPS_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        statusEl.className = 'status success';
                        statusEl.innerText = "✅ Successfully uploaded to Google Drive!";
                    } else {
                        statusEl.className = 'status error';
                        statusEl.innerText = "❌ Upload failed: " + result.message;
                    }
                } catch (error) {
                    statusEl.className = 'status error';
                    statusEl.innerText = "❌ Network error. Check Apps Script URL.";
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
